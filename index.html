<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecionando para WhatsApp…</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      :root {
        color-scheme: light;
        --bg: #0b1220;
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --ring: rgba(255, 255, 255, 0.18);
        --accent: #22c55e;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: radial-gradient(1200px 800px at 20% 0%, rgba(34, 197, 94, 0.18), transparent 55%),
          radial-gradient(1000px 700px at 100% 10%, rgba(59, 130, 246, 0.16), transparent 45%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .spinner {
        width: 62px;
        height: 62px;
        border-radius: 999px;
        border: 6px solid var(--ring);
        border-top-color: rgba(34, 197, 94, 0.85);
        animation: spin 0.9s linear infinite;
        will-change: transform;
        box-shadow: 0 18px 65px rgba(0, 0, 0, 0.38);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 1.4s;
        }
      }
      .title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.35;
        max-width: 520px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner" aria-label="Carregando"></div>
      <div class="title">Redirecionando para o WhatsApp…</div>
      <div class="sub">Aguarde um instante.</div>
    </div>

    <script>
      // ======== CONFIGURE AQUI ========
      // Opção A (recomendado): passe credenciais por URL (não fica gravado no HTML):
      //   /pressell/index.html?sb_url=https://xxxx.supabase.co&sb_anon=ANON_PUBLICA
      //
      // Opção B: preencha abaixo (menos seguro, fica no ficheiro).
      /**
       * Modo recomendado (Vercel): passe credenciais do Supabase no URL para distribuir usando `ZAP DISPONIVEL`.
       *
       * Opcional: router HTTPS no ZapMan (não usar HTTP/IP directo desde HTTPS — mixed-content/CORS).
       *   ?zapman=https://SEU_ZAPMAN_PUBLICO&cluster_secret=OPCIONAL
       *
       * No servidor ZapMan:
       * - ZAPMAN_QUIZ_ROUTER_PUBLIC=1 (se você usa ZAPMAN_OUTREACH_CLUSTER_SECRET)
       * - ZAPMAN_CORS_ORIGINS=https://rotaciona.vercel.app
       */
      const ZAPMAN_BASE_DEFAULT = ""; // ex.: "https://zapman.seudominio.com" (HTTPS recomendado)

      const SUPABASE_URL_DEFAULT = "https://okooczucxgmmzywnores.supabase.co/";
      const SUPABASE_ANON_KEY_DEFAULT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rb29jenVjeGdtbXp5d25vcmVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NzQxNTAsImV4cCI6MjA5MTU1MDE1MH0.uOxb9nz4l0nuGfqDM_W5fvyTmFurGy4J90N2GOnCQXc";
      const TABLE_NAME = "ZAP DISPONIVEL";

      const COL_STATUS = "STATUS";
      const COL_DISP = "DISPONIVEL ?";
      const COL_NUM = "NUMERO";
      const COL_INST = "INSTÂNCIA";
      /** Capacidade (ZapMan preenche). Se a tabela não tiver estas colunas, o fetch faz fallback sem elas. */
      const COL_ATIVOS = "ATIVOS";
      const COL_LIMITE = "LIMITE";
      const COL_LEADS_HOJE = "LEADS_HOJE";
      const COL_LAST_ASSIGNED_AT = "LAST_ASSIGNED_AT";

      /** Se 1, tenta PATCH no Supabase antes de redirecionar (requer políticas RLS ok para anon update). */
      const UPDATE_ZAP_DISPONIVEL_COUNTERS = String(
        new URL(window.location.href).searchParams.get("update_counters") || ""
      ).trim() === "1";

      const RETRY_MS = 1200;
      const REQ_TIMEOUT_MS = 5000;
      // =================================

      function readSupabaseConfigFromQuery() {
        try {
          const u = new URL(window.location.href);
          const sbUrl = String(u.searchParams.get("sb_url") || "").trim();
          const sbAnon = String(u.searchParams.get("sb_anon") || "").trim();
          return { sbUrl, sbAnon };
        } catch {
          return { sbUrl: "", sbAnon: "" };
        }
      }

      function readZapmanConfigFromQuery() {
        try {
          const u = new URL(window.location.href);
          const zap = String(u.searchParams.get("zapman") || u.searchParams.get("zapman_base") || "").trim();
          const sec = String(u.searchParams.get("cluster_secret") || u.searchParams.get("zapman_secret") || "").trim();
          return { zap, sec };
        } catch {
          return { zap: "", sec: "" };
        }
      }

      const __q = readSupabaseConfigFromQuery();
      const __z = readZapmanConfigFromQuery();
      const ZAPMAN_BASE = (__z.zap || ZAPMAN_BASE_DEFAULT || "").trim().replace(/\/+$/, "");
      const ZAPMAN_CLUSTER_SECRET = (__z.sec || "").trim();
      const SUPABASE_URL = (__q.sbUrl || SUPABASE_URL_DEFAULT || "").trim();
      const SUPABASE_ANON_KEY = (__q.sbAnon || SUPABASE_ANON_KEY_DEFAULT || "").trim();

      const WA_PREFILL_MESSAGES = [
        "Oi! Quero conhecer seus conteúdos 🙂",
        "Oi! Quero ver seus conteúdos 🙂",
        "Oi! Quero ver seu conteúdo exclusivo 🙂",
        "Oi! Quero saber mais sobre seus conteúdos 🙂",
        "Oi! Tenho interesse nos seus conteúdos 🙂",
        "Oi! Pode me mandar as opções de conteúdo? 🙂",
        "Oi! Quero ver o que você tem disponível 🙂",
        "Oi! Quero começar a acompanhar seus conteúdos 🙂",
        "Oi! Quero ver seus conteúdos novos 🙂",
        "Oi! Quero ver seus conteúdos e valores 🙂",
        "Oi! Quero ver seus conteúdos e como funciona 🙂",
        "Oi! Quero ver seus conteúdos e pagamento 🙂",
        "Oi! Quero ver seus conteúdos e o que você recomenda 🙂",
        "Oi! Quero ver seus conteúdos, pode me ajudar? 🙂",
        "Oi! Quero ver seus conteúdos, estou disponível agora 🙂",
      ];

      function readOptionalPrefillFromQuery() {
        try {
          const u = new URL(window.location.href);
          return String(u.searchParams.get("msg") || "").trim();
        } catch {
          return "";
        }
      }

      function choosePrefillMessage() {
        const forced = readOptionalPrefillFromQuery();
        if (forced) return forced.slice(0, 800);

        const key = "pressel_wa_msg_rr_v1";
        const storageWorks = (kind) => {
          try {
            if (kind === "local" && typeof localStorage === "undefined") return false;
            if (kind === "session" && typeof sessionStorage === "undefined") return false;
            const s = kind === "local" ? localStorage : sessionStorage;
            const t = "__zapman_msg_test__";
            s.setItem(t, "1");
            s.removeItem(t);
            return true;
          } catch {
            return false;
          }
        };

        const canLocal = storageWorks("local");
        const canSession = storageWorks("session");
        const list = WA_PREFILL_MESSAGES.filter((s) => String(s || "").trim());
        if (!list.length) return "";

        if (!canLocal && !canSession) {
          return list[Math.floor(Math.random() * list.length)];
        }

        const readIdx = () => {
          try {
            if (canLocal) return Number(localStorage.getItem(key) || "0") || 0;
          } catch {
            /* ignore */
          }
          try {
            if (canSession) return Number(sessionStorage.getItem(key) || "0") || 0;
          } catch {
            /* ignore */
          }
          return 0;
        };

        const writeIdx = (next) => {
          const v = String((next % 1000000 + 1000000) % 1000000);
          try {
            if (canLocal) localStorage.setItem(key, v);
            else if (canSession) sessionStorage.setItem(key, v);
          } catch {
            /* ignore */
          }
        };

        const idx = readIdx();
        const msg = list[idx % list.length];
        writeIdx(idx + 1);
        return String(msg);
      }

      function normalizeDigits(v) {
        return String(v ?? "").replace(/\D/g, "");
      }

      function safeChoosePrefillMessage() {
        try {
          return choosePrefillMessage();
        } catch {
          return "";
        }
      }

      function waUrlForNumberDigits(digits) {
        const d = normalizeDigits(digits);
        if (!d) return "";
        const base = `https://wa.me/${d}`;
        const msg = safeChoosePrefillMessage();
        if (!msg) return base;
        try {
          const maxTotal = 2000;
          let budget = maxTotal - base.length - "?text=".length;
          if (budget < 24) return base;
          const encFull = encodeURIComponent(msg);
          if (encFull.length <= budget) return `${base}?text=${encFull}`;
          let lo = 0;
          let hi = msg.length;
          let best = 0;
          while (lo <= hi) {
            const mid = Math.floor((lo + hi) / 2);
            const enc = encodeURIComponent(msg.slice(0, mid));
            if (enc.length <= budget) {
              best = mid;
              lo = mid + 1;
            } else {
              hi = mid - 1;
            }
          }
          return `${base}?text=${encodeURIComponent(msg.slice(0, best))}`;
        } catch {
          return base;
        }
      }

      function supabaseRestUrl() {
        const base = String(SUPABASE_URL || "").trim().replace(/\/+$/, "");
        return `${base}/rest/v1/${encodeURIComponent(TABLE_NAME)}`;
      }

      async function fetchRowsSelect(selectList) {
        const url = new URL(supabaseRestUrl());
        url.searchParams.set("select", selectList);
        url.searchParams.set("limit", "200");

        const ac = new AbortController();
        const t = setTimeout(() => ac.abort(), REQ_TIMEOUT_MS);
        try {
          const r = await fetch(url.toString(), {
            method: "GET",
            signal: ac.signal,
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              Accept: "application/json",
            },
          });
          const text = await r.text();
          let json = null;
          try {
            json = text ? JSON.parse(text) : null;
          } catch {
            /* ignore */
          }
          if (!r.ok) {
            const detail =
              (json && (json.message || json.error_description || json.error)) ||
              (text || `HTTP ${r.status}`);
            throw new Error(String(detail));
          }
          if (!Array.isArray(json)) return [];
          return json;
        } finally {
          clearTimeout(t);
        }
      }

      /** Lê linhas; tenta incluir ATIVOS/LIMITE (ZapMan). Se a tabela não tiver, repete sem essas colunas. */
      async function fetchEligibleRows() {
        const full = `${COL_NUM},"${COL_INST}",${COL_STATUS},"${COL_DISP}",${COL_ATIVOS},${COL_LIMITE},${COL_LEADS_HOJE},${COL_LAST_ASSIGNED_AT}`;
        const mid = `${COL_NUM},"${COL_INST}",${COL_STATUS},"${COL_DISP}",${COL_ATIVOS},${COL_LIMITE}`;
        const basic = `${COL_NUM},"${COL_INST}",${COL_STATUS},"${COL_DISP}"`;
        try {
          return await fetchRowsSelect(full);
        } catch {
          try {
            return await fetchRowsSelect(mid);
          } catch {
            return await fetchRowsSelect(basic);
          }
        }
      }

      function readAtivosDefault0(row) {
        const raw = row?.[COL_ATIVOS];
        if (raw == null || String(raw).trim() === "") return 0;
        return Math.max(0, Math.floor(Number(raw) || 0));
      }

      function readLeadsHojeDefault0(row) {
        const raw = row?.[COL_LEADS_HOJE];
        if (raw == null || String(raw).trim() === "") return 0;
        return Math.max(0, Math.floor(Number(raw) || 0));
      }

      /** Vazio conta como «mais antigo» ⇒ menor ms primeiro na ordenação. */
      function readLastAssignedMs(row) {
        const raw = row?.[COL_LAST_ASSIGNED_AT];
        if (raw == null || String(raw).trim() === "") return 0;
        const t = new Date(String(raw)).getTime();
        return Number.isFinite(t) ? t : 0;
      }

      function chooseRowFairDistribution(rows, visitJitter) {
        if (!rows.length) return null;
        const jitter = Math.max(0, Math.floor(Number(visitJitter) || 0)) % rows.length;
        return chooseRowRoundRobin(rows, jitter);
      }

      /**
       * Escolhe a linha do WhatsApp «menos ocupada» (filtro STATUS=ON / DISPONIVEL=SIM fica antes, em `isEligible`).
       * Prioridade: menor ATIVOS → menor LEADS_HOJE → LAST_ASSIGNED_AT mais antigo → rodízio estável + leve aleatoriedade.
       */
      function chooseRowRoundRobin(rows, jitter) {
        if (!rows.length) return null;
        const scored = rows.map((r, i) => {
          const at = readAtivosDefault0(r);
          const lh = readLeadsHojeDefault0(r);
          const lastMs = readLastAssignedMs(r);
          const inst = String(r?.[COL_INST] ?? "").trim();
          return { r, at, lh, lastMs, inst, i };
        });
        scored.sort((a, b) => a.at - b.at || a.lh - b.lh || a.lastMs - b.lastMs || a.inst.localeCompare(b.inst) || a.i - b.i);
        const best = scored[0];
        const tied = scored.filter((x) => x.at === best.at && x.lh === best.lh && x.lastMs === best.lastMs);
        const pool = tied.map((x) => x.r);

        const n = pool.length;
        const jitter0 =
          Math.max(0, Math.floor(Number(jitter) || 0)) % Math.max(1, n) + Math.floor(Math.random() * Math.max(1, n));
        const j0 = n ? jitter0 % n : 0;
        const key = "pressel_rr_idx_v2";
        const storageWorks = (kind) => {
          try {
            if (kind === "local" && typeof localStorage === "undefined") return false;
            if (kind === "session" && typeof sessionStorage === "undefined") return false;
            const s = kind === "local" ? localStorage : sessionStorage;
            const t = "__zapman_rr_test__";
            s.setItem(t, "1");
            s.removeItem(t);
            return true;
          } catch {
            return false;
          }
        };

        const canLocal = storageWorks("local");
        const canSession = storageWorks("session");

        if (!canLocal && !canSession) {
          const j = (j0 + Math.floor(Math.random() * rows.length)) % rows.length;
          return rows[j] || rows[0];
        }

        const readIdx = () => {
          try {
            if (canLocal) return Number(localStorage.getItem(key) || "0") || 0;
          } catch {
            /* ignore */
          }
          try {
            if (canSession) return Number(sessionStorage.getItem(key) || "0") || 0;
          } catch {
            /* ignore */
          }
          return 0;
        };

        const writeIdx = (next) => {
          const v = String((next % 1000000 + 1000000) % 1000000);
          try {
            if (canLocal) localStorage.setItem(key, v);
            else if (canSession) sessionStorage.setItem(key, v);
          } catch {
            /* ignore */
          }
        };

        const base = readIdx();
        const picked = pool[(base + j0) % Math.max(1, n)];
        writeIdx(base + 1);
        return picked;
      }

      function isEligible(row) {
        try {
          const st = String(row?.[COL_STATUS] ?? "").trim().toUpperCase();
          const disp = String(row?.[COL_DISP] ?? "").trim().toUpperCase();
          return st === "ON" && disp === "SIM";
        } catch {
          return false;
        }
      }

      async function tryRedirectFlow() {
        const urlOk = /^https?:\/\//i.test(String(SUPABASE_URL || ""));
        const keyOk = String(SUPABASE_ANON_KEY || "").length > 20 && !String(SUPABASE_ANON_KEY).includes("COLE_AQUI");
        if (!urlOk || !keyOk) {
          return;
        }

        const rowsAll = await fetchEligibleRows();
        const eligible = (rowsAll || []).filter(isEligible);
        if (!eligible.length) return { ok: false, reason: "no_eligible" };

        const visitJitter = eligible.length > 1 ? Math.floor(Math.random() * eligible.length) : 0;
        const picked = chooseRowFairDistribution(eligible, visitJitter);
        const num = picked?.[COL_NUM];
        const digits = normalizeDigits(num);
        const waUrl = waUrlForNumberDigits(digits);
        if (!waUrl) {
          return { ok: false, reason: "invalid_number" };
        }

        if (UPDATE_ZAP_DISPONIVEL_COUNTERS && picked) {
          try {
            await patchZapDisponivelCounters(picked);
          } catch {
            /* ignore */
          }
        }

        window.location.replace(waUrl);

        return { ok: true, waUrl };
      }

      async function patchZapDisponivelCounters(row) {
        const digits = normalizeDigits(row?.[COL_NUM]);
        if (!digits) return;
        const inst = String(row?.[COL_INST] ?? "").trim();

        const url = new URL(supabaseRestUrl());
        // Filtro por número (e instância se existir) — evita update em massa.
        url.searchParams.set(`${COL_NUM}`, `eq.${digits}`);
        if (inst) url.searchParams.set(`${COL_INST}`, `eq.${inst}`);

        const curLh = readLeadsHojeDefault0(row);
        const nextLh = curLh + 1;
        const nowIso = new Date().toISOString();

        const ac = new AbortController();
        const t = setTimeout(() => ac.abort(), REQ_TIMEOUT_MS);
        try {
          const r = await fetch(url.toString(), {
            method: "PATCH",
            signal: ac.signal,
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              Accept: "application/json",
              "Content-Type": "application/json",
              Prefer: "return=minimal",
            },
            body: JSON.stringify({
              [COL_LEADS_HOJE]: nextLh,
              [COL_LAST_ASSIGNED_AT]: nowIso,
            }),
          });
          if (!r.ok) {
            const txt = await r.text().catch(() => "");
            throw new Error(txt || `HTTP ${r.status}`);
          }
        } finally {
          clearTimeout(t);
        }
      }

      function setStatus(title, sub) {
        try {
          const t = document.querySelector(".title");
          const s = document.querySelector(".sub");
          if (t && title) t.textContent = title;
          if (s && sub) s.textContent = sub;
        } catch {
          /* ignore */
        }
      }

      async function tryZapmanQuizRouterFlow() {
        const base = String(ZAPMAN_BASE || "").trim().replace(/\/+$/, "");
        if (!/^https?:\/\//i.test(base)) return { ok: false, reason: "no_zapman_base" };
        try {
          const h = new URL(base).hostname.toLowerCase();
          if (h === "127.0.0.1" || h === "localhost") return { ok: false, reason: "zapman_host_blocked" };
          if (h === "72.61.44.250") return { ok: false, reason: "zapman_host_blocked" };
        } catch {
          return { ok: false, reason: "zapman_url_invalida" };
        }

        const msg = safeChoosePrefillMessage();
        const u = new URL(`${base}/api/quiz-router/route`);
        u.searchParams.set("redirect", "0"); // força JSON
        if (msg) u.searchParams.set("message", msg);

        const headers = { Accept: "application/json" };
        if (ZAPMAN_CLUSTER_SECRET) headers["X-Zapman-Cluster-Secret"] = ZAPMAN_CLUSTER_SECRET;

        const ac = new AbortController();
        const t = setTimeout(() => ac.abort(), REQ_TIMEOUT_MS);
        try {
          const r = await fetch(u.toString(), { method: "GET", signal: ac.signal, mode: "cors", headers });
          const text = await r.text();
          let json = null;
          try {
            json = text ? JSON.parse(text) : null;
          } catch {
            /* ignore */
          }
          if (!r.ok || !json?.ok || !json?.waLink) {
            const detail = (json && (json.error || json.message)) || text || `HTTP ${r.status}`;
            throw new Error(String(detail));
          }
          window.location.replace(String(json.waLink));
          return { ok: true, waUrl: String(json.waLink) };
        } finally {
          clearTimeout(t);
        }
      }

      async function start() {
        let waitMs = RETRY_MS;
        let warnedNoConfig = false;
        for (;;) {
          try {
            // 1) Supabase (ZAP DISPONIVEL) — mesmo critério usado pelo ZapMan local/VPS quando ambos atualizam a tabela.
            const r = await tryRedirectFlow();
            if (r?.ok) return;

            // 2) ZapMan HTTPS (opcional; não usar HTTP/IP misto desde páginas HTTPS)
            if (ZAPMAN_BASE) {
              const z = await tryZapmanQuizRouterFlow();
              if (z?.ok) return;
            }
          } catch (e) {
            // Mostra erro útil (senão parece “loading infinito” silencioso)
            if (!warnedNoConfig) {
              warnedNoConfig = true;
              const msg = String(e?.message || e || "");
              setStatus(
                "Não consegui redirecionar automaticamente.",
                msg
                  ? msg.slice(0, 520)
                  : "Configure ?zapman=URL_DO_ZAPMAN (HTTPS) ou sb_url/sb_anon. Verifique também CORS no ZapMan (ZAPMAN_CORS_ORIGINS) e mixed-content (HTTPS→HTTP)."
              );
            }
          }

          // Se não há configuração nenhuma, não faz spin infinito “mudo”
          const hasZap = Boolean(ZAPMAN_BASE);
          const hasSb =
            /^https?:\/\//i.test(String(SUPABASE_URL || "")) &&
            String(SUPABASE_ANON_KEY || "").length > 20 &&
            !String(SUPABASE_ANON_KEY).includes("COLE_AQUI");
          if (!hasZap && !hasSb) {
            setStatus(
              "Configuração em falta",
              'Adicione no URL: ?zapman=https://SEU_ZAPMAN (recomendado) ou ?sb_url=...&sb_anon=...'
            );
            return;
          }

          await new Promise((r) => setTimeout(r, waitMs));
          waitMs = Math.min(15000, Math.floor(waitMs * 1.25));
        }
      }

      void start();
    </script>
  </body>
</html>
